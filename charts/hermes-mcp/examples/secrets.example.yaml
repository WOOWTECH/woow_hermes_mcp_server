# -----------------------------------------------------------------------------
# Secret for charts/hermes-mcp - PLACEHOLDERS ONLY. Never commit real values.
#
# The chart references this Secret by name (values: existingSecret) and does not
# render it, so a `helm upgrade` can never overwrite a rotated password or token.
# Copy this file OUTSIDE the repo, replace every REPLACE_ME value, then apply the
# copy:
#   kubectl --context woow-k3s apply -f /secure/path/hermes-mcp-secrets.yaml
#
# Alternatively let the chart create it on a fresh install:
#   helm install ... --set secrets.create=true \
#     --set secrets.adminPassword=... --set secrets.jwtSecret=... \
#     --set secrets.mcpAuthToken=... --set secrets.gatewayApiKey=... \
#     --set secrets.dashboardPassword=...
# Every one of those five is required(): there are no default credentials.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: hermes-mcp-secrets
  namespace: hermes-mcp-admin
type: Opaque
stringData:
  # Seeds the first boot only. Afterwards /data/config.json on the PVC is the
  # source of truth: the Settings page changes the password, the Tokens page
  # rotates the MCP token, and neither is written back here.
  ADMIN_PASSWORD: "REPLACE_ME_ADMIN_PASSWORD"
  MCP_AUTH_TOKEN: "REPLACE_ME_MCP_AUTH_TOKEN"
  # Signs the admin session cookie; a random one is generated if unset, which
  # logs everyone out on every restart. Rotating it also logs everyone out.
  JWT_SECRET: "REPLACE_ME_JWT_SECRET"
  # Upstream Hermes Agent: Gateway :8642 API key and Dashboard :9119 password.
  HERMES_GATEWAY_API_KEY: "REPLACE_ME_GATEWAY_API_KEY"
  HERMES_DASHBOARD_PASSWORD: "REPLACE_ME_DASHBOARD_PASSWORD"

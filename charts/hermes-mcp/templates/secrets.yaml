{{- /*
The console's own Secret, rendered only with secrets.create=true. By default it
is created out of band from examples/secrets.example.yaml and the chart never
touches it, so an upgrade cannot overwrite a rotated password or token with an
empty value. Every key is required() - the chart ships no default credentials.
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret }}
  namespace: {{ include "hermes-mcp.ns" . }}
  {{- with (include "hermes-mcp.labels" .) }}
  labels:
    {{- . | nindent 4 }}
  {{- end }}
  {{- include "hermes-mcp.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  # Seeds the first boot only: after that /data/config.json is the source of
  # truth for the admin password and the MCP auth token.
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required when secrets.create=true" $s.adminPassword | quote }}
  MCP_AUTH_TOKEN: {{ required "secrets.mcpAuthToken is required when secrets.create=true" $s.mcpAuthToken | quote }}
  # Signs the admin session cookie. Rotating it logs everyone out.
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true" $s.jwtSecret | quote }}
  # Upstream Hermes Agent credentials.
  HERMES_GATEWAY_API_KEY: {{ required "secrets.gatewayApiKey is required when secrets.create=true" $s.gatewayApiKey | quote }}
  HERMES_DASHBOARD_PASSWORD: {{ required "secrets.dashboardPassword is required when secrets.create=true" $s.dashboardPassword | quote }}
{{- end }}

{{- /*
The Namespace. One that equals the release namespace is skipped: Helm keeps its
release record there, so it is created with --create-namespace instead and can
never be deleted by `helm uninstall`.
*/ -}}
{{- if .Values.namespace.create }}
{{- if ne (include "hermes-mcp.ns" .) .Release.Namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "hermes-mcp.ns" . }}
  {{- with (include "hermes-mcp.labels" .) }}
  labels:
    {{- . | nindent 4 }}
  {{- end }}
  {{- include "hermes-mcp.keepAnnotations" . | nindent 2 }}
{{- end }}
{{- end }}
